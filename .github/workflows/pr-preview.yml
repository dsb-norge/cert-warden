name: PR preview tag
#
# Zero-manual-intervention testing from a calling repo: every same-repo PR gets a
# `preview/pr-<N>` tag pointing at a GENERATED, DETACHED commit — the PR's tree with all
# internal `uses: dsb-norge/cert-warden/...@vX.Y.Z` refs rewritten to the preview tag itself,
# so workflows and actions resolve self-consistently through one ref. The PR branch is never
# touched; nothing of this ever lands on main. A sticky comment on the PR carries the
# copy-paste ref; the tag is force-moved on every push and deleted when the PR closes.
#
# Fork PRs are skipped (the job needs `contents: write`); maintainers can run the rewrite
# locally for fork contributions.
#
# TOKEN: pushing a tag whose tree contains MODIFIED workflow files requires the `workflows`
# permission — which GITHUB_TOKEN cannot be granted and org policy denies deploy keys for.
# The push therefore uses the release GitHub App token (same App as release-please). Until
# the App is configured (RELEASE_APP_ID variable + RELEASE_APP_PRIVATE_KEY secret) the
# preview is UNAVAILABLE and the sticky comment says so.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-preview:
    name: "publish preview tag"
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # sticky comment
    outputs:
      preview-ref: ${{ steps.preview.outputs.preview-ref }}
      preview-commit: ${{ steps.preview.outputs.preview-commit }}
      pinned-ref: ${{ steps.preview.outputs.pinned-ref }}
      published: ${{ steps.preview.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Mint App token (workflows:write — required to push rewritten workflow files)
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Build preview commit and push tag
        id: preview
        if: steps.app-token.outcome == 'success'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          previewRef="preview/pr-${PR_NUMBER}"
          # An immutable per-push ref, ALONGSIDE the moving one. Internal refs are rewritten to
          # this, so the published tree is self-referential: every internal `uses:` resolves to
          # the very commit being published.
          #
          # Why not the moving tag (the original design): it is force-moved on every push, so a
          # consumer pinning the generated commit still had `uses: .../actions/warden@preview/pr-N`
          # resolved at job start time. A rebuild landing mid-run served two different engines to
          # two jobs of one run.
          #
          # Why not the PR head SHA (tried, and wrong): actions would resolve correctly, since
          # only `.github/workflows/*.yml` is rewritten and the action directories are identical.
          # But reusable workflows reference EACH OTHER, and a workflow-to-workflow `uses:` needs
          # the REWRITTEN file, which exists only inside the generated commit. Pointing at the
          # head SHA fetches the un-rewritten one, whose own refs are `@vX.Y.Z` -- resolving the
          # released engine instead of the PR's, or failing outright on a release PR where that
          # version does not exist yet. A commit cannot embed its own SHA, which is exactly why
          # a tag is needed here.
          pinnedRef="${previewRef}-${HEAD_SHA:0:7}"

          bash scripts/ci/rewrite-internal-refs.sh "${pinnedRef}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Detached generated commit: parent = the PR head (provenance), tree = rewritten
          # working tree. The PR branch itself is never modified.
          git add -A
          tree="$(git write-tree)"
          commit="$(git commit-tree "${tree}" -p "${HEAD_SHA}" \
            -m "preview: ${previewRef} (generated from ${HEAD_SHA}, internal refs rewritten)")"

          # Tag the immutable ref FIRST, so the self-referential refs inside the tree resolve.
          git tag -f "${pinnedRef}" "${commit}"
          git tag -f "${previewRef}" "${commit}"

          # Guard: every internal ref in the published tree must name ${pinnedRef}, and that ref
          # must resolve to the commit being published. That is the hermeticity property stated
          # as a check rather than a comment, and it is deliberately stricter than "no mutable
          # ref": pointing at some OTHER immutable commit passes that weaker test while still
          # serving the wrong code, which is how the head-SHA attempt slipped through with a
          # green preview-consume that was exercising the released engine.
          # Scoped to exactly the files rewrite-internal-refs.sh rewrites — the ones a consumer
          # fetches and resolves. A wider `*.yml` also matches this workflow's own prose and the
          # sticky-comment heredoc's `${PREVIEW_REF}` placeholders, which are templates rather
          # than references, and it fails the guard on its own documentation.
          badRefs="$(git grep -hoE 'uses:[[:space:]]+dsb-norge/cert-warden[^@[:space:]]*@[^[:space:]]+' \
            "${commit}" -- '.github/workflows/reusable-*.yml' '.github/workflows/preview-consume.yml' |
            grep -vE "@${pinnedRef}\$" || true)"
          if [[ -n "${badRefs}" ]]; then
            echo "::error::preview commit ${commit} has internal refs not pinned to ${pinnedRef}:"
            echo "${badRefs}"
            exit 1
          fi
          if [[ "$(git rev-parse "${pinnedRef}^{commit}")" != "${commit}" ]]; then
            echo "::error::${pinnedRef} does not resolve to the published commit ${commit}."
            exit 1
          fi
          echo "Guard: every internal ref in ${commit} names ${pinnedRef}, which is ${commit}."

          git push --force "https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git" \
            "refs/tags/${previewRef}" "refs/tags/${pinnedRef}"

          {
            echo "preview-ref=${previewRef}"
            echo "pinned-ref=${pinnedRef}"
            echo "preview-commit=${commit}"
            echo "published=true"
          } >>"${GITHUB_OUTPUT}"
          echo "Published ${previewRef} and ${pinnedRef} -> ${commit} (parent ${HEAD_SHA})"

      - name: Compose sticky comment
        env:
          PUBLISHED: ${{ steps.preview.outputs.published }}
          PREVIEW_REF: ${{ steps.preview.outputs.preview-ref }}
          PREVIEW_COMMIT: ${{ steps.preview.outputs.preview-commit }}
          PINNED_REF: ${{ steps.preview.outputs.pinned-ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${PUBLISHED}" != "true" ]]; then
            cat >preview-comment.md <<'EOF'
          ### 🧪 Preview ref: unavailable (bootstrap)

          Publishing a preview tag rewrites workflow files, which requires the release GitHub
          App (`workflows: write`). Once `RELEASE_APP_ID`/`RELEASE_APP_PRIVATE_KEY` are
          configured, every PR gets a consumable `preview/pr-<N>` ref here automatically.
          EOF
            exit 0
          fi
          cat >preview-comment.md <<EOF
          ### 🧪 Preview ref for this PR: \`${PREVIEW_REF}\`

          **A quick try** — moves with every push to this PR:

          ~~~yaml
          # reusable workflows
          uses: dsb-norge/cert-warden/.github/workflows/reusable-warden.yml@${PREVIEW_REF}
          # composite actions
          uses: dsb-norge/cert-warden/actions/warden@${PREVIEW_REF}
          ~~~

          **Running it somewhere real, for longer than one job?** Use the immutable per-push
          ref. It never moves, and every internal ref inside it names itself — so a rebuild
          mid-run cannot swap the engine underneath you:

          ~~~yaml
          # reusable workflows
          uses: dsb-norge/cert-warden/.github/workflows/reusable-warden.yml@${PINNED_REF}
          # composite actions
          uses: dsb-norge/cert-warden/actions/warden@${PINNED_REF}
          ~~~

          - Refreshed on every push to this PR (currently \`${HEAD_SHA:0:7}\` → generated commit \`${PREVIEW_COMMIT:0:7}\`).
          - Every push adds a new \`${PREVIEW_REF}-<sha>\`; all of them are deleted when the PR
            closes, so pin one for validation and never for production.
          EOF

      # In-repo upsert instead of marocchino/sticky-pull-request-comment. Beyond dropping a
      # bus-factor-1 dependency: this job mints an App token (contents+workflows write), and
      # same-job steps share the runner — no third-party code belongs next to that token.
      - name: Upsert sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci/sticky-comment.sh upsert pr-preview preview-comment.md

  preview-consume-e2e:
    name: "preview-consume-e2e"
    # Remote-fetch e2e (docs/testing.md L3b): dispatch preview-consume.yml AT the preview tag —
    # its internal refs are rewritten to the tag, so this run consumes the PR's actions and
    # reusable workflows through GitHub's real remote-fetch path, exactly like a calling repo.
    needs: publish-preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.publish-preview.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch + watch the consumed run
    steps:
      - name: Dispatch preview-consume at the preview tag and await conclusion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREVIEW_REF: ${{ needs.publish-preview.outputs.preview-ref }}
          PREVIEW_COMMIT: ${{ needs.publish-preview.outputs.preview-commit }}
        run: |
          gh workflow run preview-consume.yml --repo "${REPO}" --ref "refs/tags/${PREVIEW_REF}"

          # Find the dispatched run (head SHA = the generated preview commit), then await it.
          runId=""
          for _ in $(seq 1 24); do
            sleep 5
            runId=$(gh run list --repo "${REPO}" --workflow preview-consume.yml \
              --json databaseId,headSha --limit 10 |
              jq -r --arg sha "${PREVIEW_COMMIT}" '[.[] | select(.headSha == $sha)][0].databaseId // empty')
            [[ -n "${runId}" ]] && break
          done
          if [[ -z "${runId}" ]]; then
            echo "::error::preview-consume run did not appear for ${PREVIEW_REF} (${PREVIEW_COMMIT})"
            exit 1
          fi
          echo "Watching preview-consume run ${runId} at ${PREVIEW_REF}"
          gh run watch --repo "${REPO}" "${runId}" --exit-status --interval 10

  cleanup-preview:
    name: "delete preview tag"
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # delete the preview tag
      pull-requests: write # drop the sticky comment
    steps:
      - name: Delete preview tag
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Every push publishes an immutable preview/pr-<N>-<sha> alongside the moving
          # preview/pr-<N>, so cleanup has to sweep the whole family or they accumulate on the
          # repo forever. Matching is anchored on the exact PR number: a naive prefix match would
          # let PR 3 delete PR 31's refs.
          mapfile -t refs < <(
            gh api "repos/${REPO}/git/matching-refs/tags/preview/pr-${PR_NUMBER}" \
              --jq '.[].ref' 2>/dev/null |
              grep -E "^refs/tags/preview/pr-${PR_NUMBER}(-[0-9a-f]+)?\$" || true
          )
          if ((${#refs[@]} == 0)); then
            echo "no preview refs for PR ${PR_NUMBER} (already absent)"
          fi
          for ref in "${refs[@]}"; do
            gh api -X DELETE "repos/${REPO}/git/${ref#refs/}" && echo "deleted ${ref}" ||
              echo "could not delete ${ref} (already gone?)"
          done

      # The PR merge ref can be gone on closed events — check out the default branch just to
      # get scripts/ci/sticky-comment.sh (single source of the marker format).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Drop sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci/sticky-comment.sh delete pr-preview
