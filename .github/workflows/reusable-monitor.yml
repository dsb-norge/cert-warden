name: reusable-monitor
#
# The packaged monitor shape: resolve which warden run to evaluate (the triggering
# workflow_run, or the latest run that actually ran), download its metrics artifact, evaluate
# the lifetime-fraction SLO, and — when the bot inputs are provided — notify the Teams
# Notification Bot. Without the bot inputs (and monitor-client-id) it is EVALUATE-ONLY and
# needs no Azure at all; use the outputs to roll your own delivery (unsupported, but enabled).
#
# Caller permissions needed: contents: read is NOT needed (no checkout); actions: read (list
# runs + download artifacts); id-token: write only when monitor-client-id is set.
#
# The monitor never fails the calling workflow on an evaluation outcome. If it cannot even
# resolve WHICH warden run to evaluate, it reports severity UNKNOWN and stays silent rather
# than raising a certificate alert about a run it never looked at — see actions/monitor/monitor.sh.

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment label; also selects the metrics artifact (cert-warden-metrics-<environment>-*)."
        type: string
        required: true
      runs-on:
        description: "Runner label (GitHub-hosted works for evaluate-only; bot delivery may need a network path)."
        type: string
        required: false
        default: "ubuntu-latest"
      warden-workflow-name:
        description: "Name of the caller's warden workflow (workflow names are caller-owned — this is the contract)."
        type: string
        required: false
        default: "Cert Warden"
      azure-tenant-id:
        description: "Azure tenant id (only needed with monitor-client-id)."
        type: string
        required: false
        default: ""
      monitor-client-id:
        description: "Client id of the monitor identity (token for the bot audience). Empty => evaluate-only."
        type: string
        required: false
        default: ""
      warn-threshold:
        description: >-
          min_lifetime_fraction WARNING level. Must stay below the ~0.333 ARI renewal point, or
          every certificate warns while waiting for its due renewal — see monitor.sh.
        type: string
        required: false
        default: "0.30"
      page-threshold:
        description: "min_lifetime_fraction CRITICAL level."
        type: string
        required: false
        default: "0.15"
      liveness-window-hours:
        description: "Max tolerated metrics age (hours) before the liveness check warns."
        type: string
        required: false
        default: "36"
      bot-api-base:
        description: "Bot API base URL; empty => evaluate-only."
        type: string
        required: false
        default: ""
      bot-api-audience:
        description: "Bot API token audience (api://…)."
        type: string
        required: false
        default: ""
      bot-alias:
        description: "Bot alias to notify."
        type: string
        required: false
        default: ""
      force-notify:
        description: "Post even when severity is OK (delivery test)."
        type: boolean
        required: false
        default: false
      dry-run:
        description: "Evaluate and log, never POST."
        type: boolean
        required: false
        default: false
    outputs:
      severity:
        description: >-
          OK | WARNING | CRITICAL | UNKNOWN. UNKNOWN means nothing was evaluated (the warden
          run could not be resolved) — it is not a health verdict and never notifies. Treat an
          unrecognised value as "no signal".
        value: ${{ jobs.monitor.outputs.severity }}
      min-lifetime-fraction:
        description: "The SLO number (null when none; EMPTY when severity is UNKNOWN)."
        value: ${{ jobs.monitor.outputs.min-lifetime-fraction }}
      managed-count:
        description: "Managed certs evaluated (EMPTY when severity is UNKNOWN — not measured)."
        value: ${{ jobs.monitor.outputs.managed-count }}
      failed-count:
        description: "Managed zones reporting an error (EMPTY when severity is UNKNOWN)."
        value: ${{ jobs.monitor.outputs.failed-count }}
      reasons-json:
        description: "JSON array of alert reasons."
        value: ${{ jobs.monitor.outputs.reasons-json }}
      notified:
        description: "true when a notification was accepted by the bot."
        value: ${{ jobs.monitor.outputs.notified }}
      resolve-failed:
        description: "true when the warden run could not be resolved (severity is then UNKNOWN)."
        value: ${{ jobs.monitor.outputs.resolve-failed }}

defaults:
  run:
    shell: bash

jobs:
  monitor:
    name: "monitor (${{ inputs.environment }})"
    runs-on: ${{ inputs.runs-on }}
    outputs:
      severity: ${{ steps.monitor.outputs.severity }}
      min-lifetime-fraction: ${{ steps.monitor.outputs.min-lifetime-fraction }}
      managed-count: ${{ steps.monitor.outputs.managed-count }}
      failed-count: ${{ steps.monitor.outputs.failed-count }}
      reasons-json: ${{ steps.monitor.outputs.reasons-json }}
      notified: ${{ steps.monitor.outputs.notified }}
      resolve-failed: ${{ steps.monitor.outputs.resolve-failed }}
    steps:
      - name: Azure login (bot-token identity)
        if: inputs.monitor-client-id != ''
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          tenant-id: ${{ inputs.azure-tenant-id }}
          client-id: ${{ inputs.monitor-client-id }}
          # The monitor identity holds no subscription RBAC by design — it only mints a token
          # for the bot API audience. Without this, az login fails subscription discovery.
          allow-no-subscriptions: true

      - name: Resolve warden run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ inputs.warden-workflow-name }}
          REPO: ${{ github.repository }}
          WR_ID: ${{ github.event.workflow_run.id }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_URL: ${{ github.event.workflow_run.html_url }}
          WR_UPDATED: ${{ github.event.workflow_run.updated_at }}
        run: |
          # Triggered by workflow_run: evaluate exactly that run — no API call, so this path
          # cannot fail to resolve. Scheduled/manual: look the run up through the API, where
          # three outcomes must stay DISTINCT, because two are real findings and one is noise:
          #
          #   * a run was found                     -> evaluate it
          #   * the API answered, but there is no    -> a real, permanent finding: WARNING.
          #     such workflow / it has no runs          A typo'd or renamed warden-workflow-name
          #                                             must keep warning, never go silent.
          #   * the API did not answer at all       -> nothing was measured: UNKNOWN, silent.
          #
          # `gh run list --workflow <name>` collapses the last two into one non-zero exit — it
          # resolves the name through /actions/workflows first, and reports "no such workflow"
          # and "the network died" identically. That is how one TLS handshake timeout reported
          # "0 managed certs" for an environment whose certificates were all healthy. So resolve
          # the name to an id explicitly, and retry only what is actually retryable.
          ghRetry() {
            local attempt
            for attempt in 1 2 3; do
              if gh "$@"; then return 0; fi
              if ((attempt < 3)); then
                echo "attempt ${attempt}/3 failed (gh ${1} …) — retrying in $((attempt * 5))s" >&2
                sleep "$((attempt * 5))"
              fi
            done
            return 1
          }

          resolveFailed="false"
          runId=""
          conclusion=""
          runUrl=""
          updatedAt=""

          if [[ "${EVENT_NAME}" == "workflow_run" && -n "${WR_ID}" ]]; then
            runId="${WR_ID}"; conclusion="${WR_CONCLUSION}"; runUrl="${WR_URL}"; updatedAt="${WR_UPDATED}"
          elif ! workflows=$(ghRetry api --paginate "repos/${REPO}/actions/workflows" \
            --jq '.workflows[] | "\(.id)\t\(.name)"'); then
            resolveFailed="true"
          else
            workflowId=$(awk -F'\t' -v want="${WORKFLOW_NAME}" '$2 == want { print $1; exit }' <<<"${workflows}")
            if [[ -z "${workflowId}" ]]; then
              # The API answered and there is no such workflow: a finding, not a blip.
              echo "::warning::no workflow named '${WORKFLOW_NAME}' in ${REPO} — check the warden-workflow-name input."
            elif ! runLine=$(ghRetry run list \
              --repo "${REPO}" \
              --workflow "${workflowId}" --status completed --limit 20 \
              --json databaseId,conclusion,updatedAt,url \
              --jq '([.[] | select(.conclusion == "success" or .conclusion == "failure")] + .)[0]
                    | "\(.databaseId) \(.conclusion) \(.updatedAt) \(.url)"'); then
              resolveFailed="true"
            else
              # Most recent run that ACTUALLY ran (success or failure) — skipped runs (deploy
              # gating) produce no metrics and are not a renewal signal; fall back to the newest
              # completed run. jq renders the no-runs case as the literal string "null" in every
              # field, which must normalise to empty or the download step is handed a bad id.
              read -r runId conclusion updatedAt runUrl <<<"${runLine}"
              if [[ "${runId}" == "null" ]]; then
                runId=""
                conclusion=""
                updatedAt=""
                runUrl=""
              fi
            fi
          fi
          {
            echo "run-id=${runId}"
            echo "conclusion=${conclusion}"
            echo "run-url=${runUrl}"
            echo "updated-at=${updatedAt}"
            echo "resolve-failed=${resolveFailed}"
          } >>"${GITHUB_OUTPUT}"
          if [[ "${resolveFailed}" == "true" ]]; then
            echo "The GitHub API did not answer after 3 attempts — the monitor will report UNKNOWN and stay silent."
          else
            echo "Resolved warden run '${runId:-none}' (${conclusion:-n/a}) updated ${updatedAt:-n/a}"
          fi

      - name: Download metrics artifact
        if: steps.resolve.outputs.run-id != ''
        continue-on-error: true # absent metrics is itself a signal the monitor handles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.resolve.outputs.run-id }}
          github-token: ${{ github.token }}
          pattern: "cert-warden-metrics-${{ inputs.environment }}-*"
          merge-multiple: true
          path: ${{ runner.temp }}/cw-metrics

      - name: Compute metrics age
        id: age
        env:
          UPDATED_AT: ${{ steps.resolve.outputs.updated-at }}
        run: |
          age=""
          if [[ -n "${UPDATED_AT}" && "${UPDATED_AT}" != "null" ]]; then
            updatedEpoch=$(date -u -d "${UPDATED_AT}" +%s)
            nowEpoch=$(date -u +%s)
            age=$(((nowEpoch - updatedEpoch) / 3600))
          fi
          echo "hours=${age}" >>"${GITHUB_OUTPUT}"

      - name: Evaluate and notify
        id: monitor
        uses: dsb-norge/cert-warden/actions/monitor@preview/pr-31 # x-release-please-version
        with:
          metrics-file: "${{ runner.temp }}/cw-metrics/cert-warden-metrics-${{ inputs.environment }}.json"
          environment-label: ${{ inputs.environment }}
          warn-threshold: ${{ inputs.warn-threshold }}
          page-threshold: ${{ inputs.page-threshold }}
          liveness-window-hours: ${{ inputs.liveness-window-hours }}
          warden-conclusion: ${{ steps.resolve.outputs.conclusion }}
          warden-run-url: ${{ steps.resolve.outputs.run-url }}
          metrics-age-hours: ${{ steps.age.outputs.hours }}
          resolve-failed: ${{ steps.resolve.outputs.resolve-failed }}
          bot-api-base: ${{ inputs.bot-api-base }}
          bot-api-audience: ${{ inputs.bot-api-audience }}
          bot-alias: ${{ inputs.bot-alias }}
          force-notify: ${{ inputs.force-notify }}
          dry-run: ${{ inputs.dry-run }}
