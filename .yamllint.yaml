extends: default

# node_modules exists locally after `npm ci` (commitlint tooling; gitignored, absent in the
# CI lint job's fresh checkout) — keep the local `yamllint --strict .` gate green anyway.
ignore: |
  node_modules/

rules:
  # GitHub workflow files routinely exceed 80 chars (expressions, URLs in comments).
  line-length:
    max: 140
  # `on:` in workflow files is a key, not a boolean — the classic false positive.
  truthy:
    check-keys: false
  # Workflows conventionally omit the document-start marker.
  document-start: disable
  comments:
    min-spaces-from-content: 1
